name: Checagem semanal (token e fila)

on:
  schedule:
    - cron: "0 12 * * 1"   # toda segunda, 9h de Brasília
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python publicar.py --verificar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Salvar
        if: always()
        run: |
          git config user.name "robo-vertices"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Checagem semanal" && git push)
