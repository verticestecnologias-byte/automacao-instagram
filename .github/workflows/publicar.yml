name: Publicar no Instagram

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 min; o robô só publica quando chega a hora marcada
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só simular, sem publicar? (true/false)"
        default: "false"

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre a versão mais nova (com o registro do que já saiu)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Preparar pastas novas (fotos e story)
        run: python preparar.py

      - name: Enviar fotos preparadas para o GitHub
        run: |
          git config user.name "robo-vertices"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fila
          if ! git diff --cached --quiet; then
            git commit -m "Preparar fotos da fila"
            git push
            sleep 20   # dá tempo do link público das fotos ficar disponível
          fi

      - name: Publicar o que estiver na hora
        run: |
          git pull -q --rebase   # pega o registro mais recente, para nunca publicar duas vezes
          python publicar.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar o progresso
        if: always()
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publicação automática"
            git pull --rebase
            git push
            echo "publicou=1" >> "$GITHUB_OUTPUT"
          fi
        id: salvar

      - name: Repor a fila com lançamentos da STLflix
        if: steps.salvar.outputs.publicou == '1' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run alimentar.yml -f simular=false -f forcar=false
